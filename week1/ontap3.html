<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <title>Tính chỉ số BMI</title>
  <style>
    body { font-family: Arial; padding: 20px; max-width: 500px; margin: auto; }
    label { display: block; margin-top: 10px; }
    input[type="number"] { width: 100%; padding: 8px; }
    .result { margin-top: 20px; font-weight: bold; }
    .toggle-btn { margin-top: 10px; }
  </style>
</head>
<body>
  <h2>Tính BMI</h2>

  <label>Chiều cao:
    <input type="number" id="height" placeholder="cm hoặc inch">
  </label>

  <label>Cân nặng:
    <input type="number" id="weight" placeholder="kg hoặc pound">
  </label>

  <label>Giới tính:
    <input type="radio" name="gender" value="Nam"> Nam
    <input type="radio" name="gender" value="Nữ"> Nữ
  </label>

  <label>Tuổi:
    <input type="number" id="age">
  </label>

  <label>
    <input type="checkbox" id="unitToggle"> Dùng đơn vị inch/pound
  </label>

  <div class="result" id="bmiResult"></div>

  <script>
    const heightInput = document.getElementById("height");
    const weightInput = document.getElementById("weight");
    const toggle = document.getElementById("unitToggle");
    const result = document.getElementById("bmiResult");

    function calculateBMI() {
      let h = parseFloat(heightInput.value);
      let w = parseFloat(weightInput.value);
      if (toggle.checked) {
        h *= 2.54;
        w *= 0.453592;
      }
      if (h > 0 && w > 0) {
        const bmi = w / ((h / 100) ** 2);
        let category = "";
        if (bmi < 18.5) category = "Gầy";
        else if (bmi < 25) category = "Bình thường";
        else if (bmi < 30) category = "Thừa cân";
        else category = "Béo phì";
        result.innerHTML = `Chỉ số BMI: ${bmi.toFixed(2)} (${category})`;
      } else {
        result.innerHTML = "";
      }
    }

    heightInput.addEventListener("input", calculateBMI);
    weightInput.addEventListener("input", calculateBMI);
    toggle.addEventListener("change", calculateBMI);
  </script>
</body>
</html>
